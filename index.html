<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniArchive</title>
</head>
<body>
    <div class="header">
        <h1>AniArchive</h1>
        <p>Melhor site para assistir animes!</p>
        <div class="buttons">
            <button>Login</button>
            <button>Cadastrar-se</button>
        </div>
    </div>
    <p>Acompanhe suas obras favoritas!<br>Salve as que deseja ver!<br>Compartilhe sua opinião!</p>
    
    <div class="section">
        <h2>Animes Populares</h2>
        <div class="images">
            <img src="anime1.jpg" alt="Anime 1">
            <img src="anime2.jpg" alt="Anime 2">
            <img src="anime3.jpg" alt="Anime 3">
            <img src="anime4.jpg" alt="Anime 4">
        </div>
    </div>
    
    <div class="section">
        <h2>Lançamentos</h2>
        <div class="images">
            <img src="anime5.jpg" alt="Anime 5">
            <img src="anime6.jpg" alt="Anime 6">
            <img src="anime7.jpg" alt="Anime 7">
            <img src="anime8.jpg" alt="Anime 8">
        </div>
    </div>
</body>
</html>
