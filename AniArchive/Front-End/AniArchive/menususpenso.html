<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ccc;
        }
        .menu {
            width: 200px;
            background-color: #333;
            padding: 20px 0;
            text-align: center;
            border-radius: 10px;
        }
        .menu-item {
            background-color: #ccc;
            padding: 20px;
            margin: 10px;
            display: block;
            color: black;
            text-decoration: none;
            font-size: 16px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <a href="#" class="menu-item">Meu perfil</a>
        <a href="#" class="menu-item">Minha lista</a>
        <a href="#" class="menu-item">Configurações</a>
    </div>
</body>
</html>
