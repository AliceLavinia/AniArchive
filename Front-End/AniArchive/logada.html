<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="src/css/logada.css">

    <title>AniArchive</title>

    <style>
        .line.large-line {
            width: 100%;
            height: 1px; /* Aumenta a espessura da linha */
            background-color: #f0f0f0; /* Mesma cor da section-header */
            margin-top: -7px; /* Adiciona um espaçamento superior */
            margin-bottom: 10px; /* Adiciona um espaçamento inferior */
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="navbar">
            <div class="overlay">
                <h1>AniArchive</h1>
            </div>
            <div class="search-profile">
                <input type="text" id="meuInput" style="display: none;">
                <img src="./src/imagens/lupinha.png" alt="Pesquisar" class="search-icon">
                <img src="./src/imagens/perfil.jpg" alt="Perfil" class="profile-img">
            </div>
        </div>
        <div class="pages-bar">
            <a href="#">Home</a>
            <a href="#">Categoria</a>
            <a href="#">Calendario</a>
        </div>
    </header>

    <section class="content">
        <div class="section-header">
            <h2>Animes Populares</h2>
            <a href="http://google.com" target="_blank" class="ver-mais">Ver mais+</a>
        </div>
        <div class="line large-line"></div> <!-- Linha decorativa maior -->
        <div class="anime-list">
            <img class="imagem" src="./src/img-ctlg-pop/one-piece.png" alt="One Piece">
            <img class="imagem" src="./src/img-ctlg-pop/naruto.jpg" alt="Naruto">
            <img class="imagem" src="./src/img-ctlg-pop/dragon-ball-z.png" alt="Dragon Ball Z">
            <img class="imagem" src="./src/img-ctlg-pop/snk.png" alt="Attack on Titan">
            <img class="imagem" src="./src/img-ctlg-pop/death-note.jpg" alt="Death Note">
            <img class="imagem" src="./src/img-ctlg-pop/dan-da-dan.png" alt="Dan Da Dan">
            <img class="imagem" src="./src/img-ctlg-pop/jjk.png" alt="Jujutsu Kaisen">
            <img class="imagem" src="./src/img-ctlg-pop/kny.jpg" alt="Kimetsu no Yaiba">
            <img class="imagem" src="./src/img-ctlg-pop/pokemon.png" alt="Pokémon">
        </div>
    
        <div class="section-header">
            <h2>Lançamentos</h2>
            <a href="http://google.com" target="_blank" class="ver-mais">Ver mais+</a>
        </div>
        <div class="line large-line"></div> <!-- Linha decorativa maior -->
        <div class="anime-list">
            <img class="imagem" src="./src/img-ctlg-lanc/amagami-sister.jpg" alt="Amagami Sister">
            <img class="imagem" src="./src/img-ctlg-lanc/blue-miburo.jpg" alt="Blue Miburo">
            <img class="imagem" src="./src/img-ctlg-lanc/dragon-ball-d.jpg" alt="Dragon Ball D">
            <img class="imagem" src="./src/img-ctlg-lanc/fairy-tail.jpg" alt="Fairy Tail">
            <img class="imagem" src="./src/img-ctlg-lanc/ghoul-school.jpg" alt="Ghoul School">
            <img class="imagem" src="./src/img-ctlg-lanc/rurouni-kenshin.jpg" alt="Rurouni Kenshin">
            <img class="imagem" src="./src/img-ctlg-lanc/sakamoto-days.jpg" alt="Sakamoto Days">
            <img class="imagem" src="./src/img-ctlg-lanc/shangrila-frontier.jpg" alt="Shangri-La Frontier">
            <img class="imagem" src="./src/img-ctlg-lanc/solo-leveling.jpg" alt="Solo Leveling">
        </div>
    
        <div class="section-header">
            <h2>Futuros Lançamentos</h2>
            <a href="http://google.com" target="_blank" class="ver-mais">Ver mais+</a>
        </div>
        <div class="line large-line"></div> <!-- Linha decorativa maior -->
        <div class="anime-list">
            <img class="imagem" src="./src/img-ctlg-fut/dress-up.png" alt="Dress Up">
            <img class="imagem" src="./src/img-ctlg-fut/dungeon-meshi.png" alt="Dungeon Meshi">
            <img class="imagem" src="./src/img-ctlg-fut/frieren.png" alt="Frieren">
            <img class="imagem" src="./src/img-ctlg-fut/hell-paradise.png" alt="Hell's Paradise">
            <img class="imagem" src="./src/img-ctlg-fut/opm.png" alt="One Punch Man">
            <img class="imagem" src="./src/img-ctlg-fut/oshi-no-ko.png" alt="Oshi no Ko">
            <img class="imagem" src="./src/img-ctlg-fut/spy-family.png" alt="Spy Family">
            <img class="imagem" src="./src/img-ctlg-fut/tanya-evil.png" alt="Tanya Evil">
            <img class="imagem" src="./src/img-ctlg-fut/bleach.png" alt="Bleach">
        </div>
    </section>     
</body>

</html>
