<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="./src/css/home.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans&display=swap" rel="stylesheet" /> 

    <title>AniArchive</title>
</head>

<body>
    <header class="header">
        <img class="imagem" src="./src/imagens/banner.jpg" alt="banner" />
        <div class="overlay"></div>
        <div class="hero-content">
            <h1>AniArchive</h1>
            <p class="subtitle">Melhor site para Listar animes!</p>
            <div class="buttons">
                <button class="btn-login" onclick="window.location.href='login.html'">Login</button>
                <button class="btn-cadastro" onclick="window.location.href='cadastro.html'">Cadastre-se</button>
            </div>
        </div>
    </header>

    <section class="extra-info">
        <h3>⭐ Acompanhe suas obras favoritas</h3>
        <h3>💾 Salve as que deseja ver</h3>
        <h3>💬 Compartilhe sua opinião</h3>
    </section>

    <section class="content">
        <h2>Animes Populares</h2>
        <div class="anime-list">
            <div class="anime-card"><img src="./src/img-ctlg-pop/one-piece.png" alt="One Piece"></div>
            <div class="anime-card"><img src="./src/img-ctlg-pop/naruto.jpg" alt="Naruto" onclick="window.location.href='teladaobra.html'"></div>
            <div class="anime-card"><img src="./src/img-ctlg-pop/dragon-ball-z.png" alt="Dragon Ball Z"></div>
            <div class="anime-card"><img src="./src/img-ctlg-pop/snk.png" alt="Shingeki no Kyojin"></div>
            <div class="anime-card"><img src="./src/img-ctlg-pop/death-note.jpg" alt="Death Note"></div>
            <div class="anime-card"><img src="./src/img-ctlg-pop/dan-da-dan.png" alt="Dan Da Dan"></div>
            <div class="anime-card"><img src="./src/img-ctlg-pop/jjk.png" alt="Jujutsu Kaisen"></div>
            <div class="anime-card"><img src="./src/img-ctlg-pop/kny.jpg" alt="Kimetsu no Yaiba"></div>
            <div class="anime-card"><img src="./src/img-ctlg-pop/pokemon.png" alt="Pokémon"></div>
        </div>

        <h2>Lançamentos</h2>
        <div class="anime-list">
            <div class="anime-card"><img src="./src/img-ctlg-lanc/amagami-sister.jpg" alt="Amagami Sister"></div>
            <div class="anime-card"><img src="./src/img-ctlg-lanc/blue-miburo.jpg" alt="Blue Miburo"></div>
            <div class="anime-card"><img src="./src/img-ctlg-lanc/dragon-ball-d.jpg" alt="Dragon Ball Daima"></div>
            <div class="anime-card"><img src="./src/img-ctlg-lanc/fairy-tail.jpg" alt="Fairy Tail"></div>
            <div class="anime-card"><img src="./src/img-ctlg-lanc/ghoul-school.jpg" alt="Ghoul School"></div>
            <div class="anime-card"><img src="./src/img-ctlg-lanc/rurouni-kenshin.jpg" alt="Rurouni Kenshin"></div>
            <div class="anime-card"><img src="./src/img-ctlg-lanc/sakamoto-days.jpg" alt="Sakamoto Days"></div>
            <div class="anime-card"><img src="./src/img-ctlg-lanc/shangrila-frontier.jpg" alt="Shangri-La Frontier"></div>
            <div class="anime-card"><img src="./src/img-ctlg-lanc/solo-leveling.jpg" alt="Solo Leveling"></div>
        </div>
    </section>
</body>
</html>
