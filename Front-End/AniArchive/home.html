<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="./src/css/home.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans&display=swap" rel="stylesheet" /> 


    <title>AniArchive</title>
</head>

<body>

    <header class="header">
        <img class="imagem" src="./src/imagens/banner.jpg" alt="banner" />
        <div class="overlay">
            <h1>AniArchive</h1>
            <p class="subtitle">Melhor site para assistir animes!</p>
            <div class="buttons">
                <button onclick="window.location.href='login.html'">Login</button>
                <button>Cadastre-se</button>
            </div>
        </div>

    </header>

    <div class="extra-info">
        <h3>Acompanhe suas obras favoritas!</h3>
        <h3>Salve as que deseja ver!</h3>
        <h3>Compartilhe sua opinião!</h3>

    <section class="content">
        <h2>Animes Populares</h2>
        <div class="anime-list">
            <img class="imagem" src=./src/img-ctlg-pop/one-piece.png alt="Anime 1">
            <img class="imagem" src=./src/img-ctlg-pop/naruto.jpg alt="Anime 2">
            <img class="imagem" src=./src/img-ctlg-pop/dragon-ball-z.png alt="Anime 3">
            <img class="imagem" src=./src/img-ctlg-pop/snk.png alt="Anime 4">
            <img class="imagem" src=./src/img-ctlg-pop/death-note.jpg alt="Anime 5">
            <img class="imagem" src=./src/img-ctlg-pop/dan-da-dan.png alt="Anime 6">
            <img class="imagem" src=./src/img-ctlg-pop/jjk.png alt="Anime 7">
            <img class="imagem" src=./src/img-ctlg-pop/kny.jpg alt="Anime 8">
            <img class="imagem" src=./src/img-ctlg-pop/pokemon.png alt="Anime 9">

        </div>

        <h2>Lançamentos</h2>
        <div class="anime-list">
            <img class="imagem" src=./src/img-ctlg-lanc/amagami-sister.jpg alt="Anime 10">
            <img class="imagem" src=./src/img-ctlg-lanc/blue-miburo.jpg alt="Anime 11">
            <img class="imagem" src=./src/img-ctlg-lanc/dragon-ball-d.jpg alt="Anime 12">
            <img class="imagem" src=./src/img-ctlg-lanc/fairy-tail.jpg alt="Anime 13">
            <img class="imagem" src=./src/img-ctlg-lanc/ghoul-school.jpg alt="Anime 14">
            <img class="imagem" src=./src/img-ctlg-lanc/rurouni-kenshin.jpg alt="Anime 15">
            <img class="imagem" src=./src/img-ctlg-lanc/sakamoto-days.jpg alt="Anime 16">
            <img class="imagem" src=./src/img-ctlg-lanc/shangrila-frontier.jpg alt="Anime ">
            <img class="imagem" src=./src/img-ctlg-lanc/solo-leveling.jpg alt="Anime 9">
        </div>
    </section>

</body>
</html>
