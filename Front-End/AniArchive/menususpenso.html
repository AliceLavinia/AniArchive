<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        body {
            margin: auto;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #333;
        }
        .menu {
            width: 150px;
            background-color: #333;
            height: 100vh;
            padding: 0;
        }
        .menu-item {
            background-color: #ccc;
            padding: 25px;
            border-bottom: 3px solid #333;
            color: black;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="menu">
        <a href="#" class="menu-item">Meu perfil</a>
        <a href="#" class="menu-item">Minha lista</a>
        <a href="#" class="menu-item">Configurações</a>
    </div>
</body>
</html>
