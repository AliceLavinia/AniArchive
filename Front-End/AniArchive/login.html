<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniArchive - Login</title>
    <link rel="stylesheet" href="./src/css/login.css">
</head>
<body>

    <header>
        <h1 class="titulo">AniArchive</h1>
    </header>

    <main>
        <div class="container">
            <h2 class="login-title">Login</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
            <div id="messageDiv"></div> <!-- For showing messages -->
        </div>
    </main>

    <script src="./login.js"></script> <!-- Add link to the login.js file -->
</body>
</html>
